# Visits the site every 10 minutes so Render's free instance doesn't go to sleep.
name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request the home page
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 -o /dev/null https://carlos-os-portfolio.onrender.com/
