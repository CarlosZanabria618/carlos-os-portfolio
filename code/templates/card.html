<article class="project-card tone-{{ item.slug }}">
<a class="project-cover" href="{{ url_for('project_detail',slug=item.slug) }}" aria-label="Open {{ item.title }}">
{% if item.slug=='plus1-speed-catch-animals' %}<img src="{{ url_for('static',filename='img/cow/cow-17.webp') }}" alt="" loading="lazy">
{% else %}<span class="cover-word" aria-hidden="true">{{ item.title }}</span>{% endif %}
</a>
<div class="card-body"><p class="card-meta">{{ item.category }}, {{ item.year }}<span class="badge">{{ item.status }}</span></p><h3><a href="{{ url_for('project_detail',slug=item.slug) }}">{{ item.title }}</a></h3><p>{{ item.summary }}</p><p class="card-stack">{{ item.stack }}</p></div>
</article>
