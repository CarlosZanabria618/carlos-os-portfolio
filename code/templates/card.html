<article class="project-card"><a class="project-cover art-{{item.art}}" href="{{url_for('project_detail',slug=item.slug)}}" aria-label="Open {{item.title}}"><span class="cover-label">{{item.category|upper}} / {{item.year}}</span><div class="cover-art" aria-hidden="true">{% if item.art == 'game' %}<span class="pixel-creature">✦</span><span class="cover-word">MERGE<br>A BRAINROT</span><span class="pixel-water">≈ ≈ ≈ ≈ ≈</span>{% elif item.art == 'wallet' %}<span class="wallet-art">HW<span>HOKIE WALLET</span></span>{% else %}<span class="cover-word">TICKETS.<br>LOADS.<br>LESS PAPER.</span>{% endif %}</div><span class="cover-arrow" aria-hidden="true">↗</span></a><div class="card-body"><div class="card-title"><h3><a href="{{url_for('project_detail',slug=item.slug)}}">{{item.title}}</a></h3><span class="file-type">{{'.rbxl' if item.category=='Games' else '.project'}}</span></div><p>{{item.summary}}</p><span class="badge">{{item.status}}</span></div></article>
